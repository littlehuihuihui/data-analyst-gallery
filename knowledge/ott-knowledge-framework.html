<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTT视频行业 · 知识框架</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070B14;
      --card: rgba(15, 23, 42, 0.55);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #22D3EE;
      --text: #E5E7EB;
      --muted: #94A3B8;
      --font-mono: "JetBrains Mono", Consolas, monospace;
      --radius: 14px;
      --theme-gradient: linear-gradient(135deg, #22D3EE 0%, #3B82F6 55%, #6366F1 100%);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      min-height: 100vh;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 48px;
      position: relative;
    }
    .page::before {
      content: "";
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 220px;
      background:
        radial-gradient(ellipse 70% 80% at 50% 0%, rgba(34, 211, 238, 0.14), transparent),
        radial-gradient(ellipse 40% 60% at 80% 20%, rgba(59, 130, 246, 0.1), transparent);
      pointer-events: none;
      z-index: 0;
    }
    .page > * { position: relative; z-index: 1; }

    .breadcrumb {
      margin-bottom: 16px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--muted);
    }
    .breadcrumb a { color: var(--accent); text-decoration: none; opacity: 0.9; }
    .breadcrumb a:hover { opacity: 1; text-decoration: underline; }
    .breadcrumb span { margin: 0 0.5rem; opacity: 0.5; }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 1.5rem 1.5rem 1.25rem;
      margin-bottom: 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.04), 0 20px 50px rgba(0, 0, 0, 0.25);
    }
    .header-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent);
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.22);
      margin-bottom: 0.65rem;
    }
    .header h1 {
      margin: 0;
      font-size: clamp(1.25rem, 3vw, 1.65rem);
      font-weight: 700;
      background: var(--theme-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .sub {
      margin: 0.65rem 0 0;
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.65;
      max-width: 720px;
    }
    .header-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      margin-top: 1.1rem;
    }
    .header-stat-num {
      font-family: var(--font-mono);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.2;
    }
    .header-stat-label {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .btn-export {
      border: 1px solid rgba(34, 211, 238, 0.4);
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.14), rgba(59, 130, 246, 0.1));
      color: #E0F2FE;
      padding: 0.7rem 1.15rem;
      border-radius: 10px;
      font-size: 0.82rem;
      font-family: var(--font-mono);
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .btn-export:hover {
      transform: translateY(-1px);
      border-color: rgba(34, 211, 238, 0.7);
      box-shadow: 0 8px 24px rgba(34, 211, 238, 0.15);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 8px;
      margin-bottom: 1.25rem;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(8px);
    }
    .tab-btn {
      padding: 0.8rem 0.5rem;
      text-align: center;
      border-radius: 10px;
      border: 1px solid transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      background: transparent;
      font-family: inherit;
      transition: all 0.2s;
    }
    .tab-btn .tab-kicker {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      opacity: 0.7;
      margin-bottom: 0.2rem;
    }
    .tab-btn.active {
      color: #fff;
      border-color: rgba(34, 211, 238, 0.4);
      background: rgba(34, 211, 238, 0.12);
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.08);
    }
    .tab-btn:hover:not(.active) {
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeUp 0.28s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .module-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      background: rgba(34, 211, 238, 0.06);
      border: 1px solid rgba(34, 211, 238, 0.14);
    }
    .module-banner .mono {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--accent);
    }
    .module-banner .hint {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
      margin-bottom: 1.5rem;
    }

    .metric-card {
      position: relative;
      padding: 1.1rem 1.15rem 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(8px);
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .metric-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.45;
    }
    .metric-card:hover {
      border-color: rgba(34, 211, 238, 0.35);
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
    }
    .metric-card:hover::before { opacity: 1; }

    .metric-card h3 {
      margin: 0 0 0.85rem;
      font-size: 0.95rem;
      color: #F8FAFC;
      font-family: var(--font-mono);
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .metric-card .field { margin-bottom: 0.7rem; }
    .metric-card .field:last-child { margin-bottom: 0; }
    .field-label {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--accent);
      padding: 0.12rem 0.4rem;
      border-radius: 4px;
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.18);
      margin-bottom: 0.35rem;
    }
    .metric-card .field span {
      color: #CBD5E1;
      display: block;
      line-height: 1.55;
      font-size: 0.84rem;
    }

    .section-title {
      font-size: 0.9rem;
      color: #E2E8F0;
      margin: 0 0 0.85rem;
      font-weight: 600;
      font-family: var(--font-mono);
    }
    .section-title::before { content: ">_ "; color: var(--accent); }

    .table-wrap {
      padding: 1rem 1.1rem;
      overflow-x: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 1rem;
      backdrop-filter: blur(8px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      min-width: 480px;
    }
    th, td {
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 0.7rem 0.55rem;
      text-align: left;
      vertical-align: top;
    }
    th {
      color: var(--accent);
      font-weight: 600;
      white-space: nowrap;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.02em;
    }
    tr:hover td { background: rgba(34, 211, 238, 0.04); }

    @media (max-width: 900px) {
      .tabs { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .page { padding: 16px 12px 32px; }
      .metric-grid { grid-template-columns: 1fr; }
      .header { padding: 1.15rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="breadcrumb">
      <a href="../index.html#industry-knowledge">数字展馆</a>
      <span>/</span>
      <a href="index.html">行业知识库</a>
      <span>/</span>
      <span style="color:var(--text);">OTT视频行业</span>
    </div>

    <header class="header">
      <div>
        <div class="header-badge">&gt;_ ott_video_industry · knowledge_framework</div>
        <h1>OTT视频行业 · 知识框架</h1>
        <p class="sub">用户画像 · 内容与播放 · 营收与广告 —— 三大模块 23 个核心指标，覆盖从用户规模到商业变现的完整分析维度</p>
        <div class="header-stats" aria-label="框架规模">
          <div><div class="header-stat-num">3</div><div class="header-stat-label">分析模块</div></div>
          <div><div class="header-stat-num">23</div><div class="header-stat-label">核心指标</div></div>
          <div><div class="header-stat-num">口径+场景</div><div class="header-stat-label">结构化字段</div></div>
          <div><div class="header-stat-num">JSON</div><div class="header-stat-label">可导出投喂</div></div>
        </div>
      </div>
      <button type="button" class="btn-export" id="btnExport">导出 AI 知识库 JSON</button>
    </header>

    <nav class="tabs" id="tabNav" aria-label="指标模块">
      <button type="button" class="tab-btn active" data-tab="tab1"><span class="tab-kicker">MODULE 01</span>用户画像指标</button>
      <button type="button" class="tab-btn" data-tab="tab2"><span class="tab-kicker">MODULE 02</span>内容与播放指标</button>
      <button type="button" class="tab-btn" data-tab="tab3"><span class="tab-kicker">MODULE 03</span>营收与广告指标</button>
    </nav>

    <section id="tab1" class="tab-panel active" data-module="用户画像指标"></section>
    <section id="tab2" class="tab-panel" data-module="内容与播放指标"></section>
    <section id="tab3" class="tab-panel" data-module="营收与广告指标"></section>
  </div>

  <script>
    const INDUSTRY = "OTT视频行业";
    const EXPORT_FILE = "OTT视频行业_知识库.json";

    const tabData = {
      tab1: [
        { name: "月活用户(MAU)", formula: "月内至少传一次PB日志到后台的用户数", scene: "衡量用户规模", definition: "统计月度内至少上报一次PB日志到后台的去重用户规模" },
        { name: "日活用户(DAU)", formula: "日内至少传一次PB日志到后台的用户数", scene: "衡量日常活跃度", definition: "统计单日内至少上报一次PB日志到后台的去重活跃用户数" },
        { name: "DAU/MAU比值", formula: "DAU / MAU", scene: "衡量用户粘性，越高越好", definition: "日活与月活的比值，反映用户使用频率与粘性" },
        { name: "新增用户数", formula: "首次激活APP的用户数", scene: "衡量拉新效果", definition: "统计周期内首次激活应用的新用户数量" },
        { name: "留存率", formula: "第N天仍活跃的用户 / 新增用户", scene: "衡量用户留存质量", definition: "新增用户在第N日仍保持活跃的比例" },
        { name: "用户活跃时段分布", formula: "分时段统计活跃用户占比", scene: "指导内容排播与推送时机", definition: "按小时或时段划分活跃用户占比的分布结构" },
        { name: "用户地域分布", formula: "分省份/城市统计用户占比", scene: "指导区域运营策略", definition: "按地理区域统计用户数量或占比的分布情况" },
        { name: "用户设备分布", formula: "分终端类型统计用户占比", scene: "指导产品适配与优化", definition: "按手机、平板、TV等终端类型统计用户占比" }
      ],
      tab2: [
        { name: "播放量(VV)", formula: "视频播放次数", scene: "衡量内容消费规模", definition: "视频被成功起播的次数统计" },
        { name: "播放时长", formula: "用户观看总时长", scene: "衡量用户沉浸度", definition: "用户有效观看视频累计的总时长" },
        { name: "人均播放时长", formula: "总播放时长 / 活跃用户数", scene: "衡量内容吸引力", definition: "平均每位活跃用户贡献的观看时长" },
        { name: "完播率", formula: "完整看完视频用户 / 开始播放用户", scene: "衡量内容质量", definition: "完整观看至结尾的用户占起播用户的比例" },
        { name: "内容启动率", formula: "点击播放次数 / 内容曝光次数", scene: "衡量封面和标题吸引力", definition: "曝光后产生点击播放行为的转化比例" },
        { name: "播放中断率", formula: "未播完退出次数 / 总播放次数", scene: "识别体验问题", definition: "未完整播放即退出的次数占总播放次数的比例" },
        { name: "热门内容TOP榜", formula: "按播放量排序的内容", scene: "指导内容采购与制作", definition: "按播放量等指标排序的热门内容榜单" },
        { name: "内容类型偏好", formula: "各类型播放占比", scene: "指导内容策略", definition: "不同内容品类在总播放中的占比结构" }
      ],
      tab3: [
        { name: "CPM（千次展示成本）", formula: "广告收入 / 广告展示量 × 1000", scene: "衡量广告定价能力", definition: "每千次广告展示对应的收入单价" },
        { name: "广告填充率", formula: "实际售出广告位 / 可售广告位", scene: "衡量广告销售效率", definition: "可售广告位中被实际填充售卖的比例" },
        { name: "订阅收入", formula: "付费用户数 × ARPU", scene: "衡量订阅业务规模", definition: "会员订阅业务产生的总收入规模" },
        { name: "付费转化率", formula: "付费用户 / 活跃用户", scene: "衡量免费转付费效率", definition: "活跃用户中转化为付费用户的比例" },
        { name: "ARPU（每用户平均收入）", formula: "总收入 / 活跃用户数", scene: "衡量用户变现效率", definition: "平均每位活跃用户贡献的收入金额" },
        { name: "用户终身价值(LTV)", formula: "用户生命周期内贡献的总收入", scene: "衡量用户长期价值", definition: "单个用户在整个生命周期内累计贡献的收入" },
        { name: "客户获取成本(CAC)", formula: "营销费用 / 新增付费用户", scene: "衡量拉新效率", definition: "获取一名新增付费用户所花费的平均营销成本" }
      ]
    };

    function esc(s) {
      return String(s).replace(/"/g, "&quot;");
    }

    function renderMetricCard(m, moduleName) {
      return `
        <article class="metric-card metric-export"
          data-name="${esc(m.name)}"
          data-module="${esc(moduleName)}"
          data-type="indicator"
          data-formula="${esc(m.formula)}"
          data-definition="${esc(m.definition)}"
          data-business-scene="${esc(m.scene)}">
          <h3>${m.name}</h3>
          <div class="field"><div class="field-label">DEFINITION</div><span>${m.definition}</span></div>
          <div class="field"><div class="field-label">FORMULA</div><span>${m.formula}</span></div>
          <div class="field"><div class="field-label">SCENE</div><span>${m.scene}</span></div>
        </article>`;
    }

    function renderTable(moduleName, items) {
      const rows = items.map(m =>
        `<tr><td>${m.name}</td><td>${m.formula}</td><td>${m.scene}</td></tr>`
      ).join("");
      return `
        <h2 class="section-title">指标一览表 · ${moduleName}</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>指标名称</th><th>计算口径</th><th>业务用途</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    function renderTab(tabId, items, moduleName) {
      const panel = document.getElementById(tabId);
      panel.innerHTML = `
        <div class="module-banner">
          <div class="mono">MODULE · ${moduleName}</div>
          <div class="hint">${items.length} 个结构化指标 · 口径 / 公式 / 场景</div>
        </div>
        <div class="metric-grid">
          ${items.map(m => renderMetricCard(m, moduleName)).join("")}
        </div>
        ${renderTable(moduleName, items)}`;
    }

    Object.keys(tabData).forEach(tabId => {
      const panel = document.getElementById(tabId);
      renderTab(tabId, tabData[tabId], panel.dataset.module);
    });

    document.querySelectorAll("#tabNav .tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#tabNav .tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
      });
    });

    document.getElementById("btnExport").addEventListener("click", () => {
      const elements = document.querySelectorAll("[data-name]");
      const indicators = [];
      elements.forEach(el => {
        indicators.push({
          name: el.getAttribute("data-name") || "",
          module: el.getAttribute("data-module") || "",
          type: el.getAttribute("data-type") || "",
          formula: el.getAttribute("data-formula") || "",
          definition: el.getAttribute("data-definition") || "",
          business_scene: el.getAttribute("data-business-scene") || ""
        });
      });
      const payload = {
        industry: INDUSTRY,
        version: "2.0",
        export_time: new Date().toISOString(),
        knowledge_base: { indicators }
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = EXPORT_FILE;
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
